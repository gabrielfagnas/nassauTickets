    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login e senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        body{   
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .conteiner{
            background: url(https://thumbs.dreamstime.com/b/stunning-purple-nebula-space-background-image-design-380291869.jpg) no-repeat center bottom;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login{
            width: 400px;
            background-color: rgba(221, 211, 211, 0.8);
            border-radius: 20px;
            box-shadow: 0px 0px 10px #fff;
            text-align: center;
            padding: 20px;
            border: 5px solid #1c0370;
        }
        .login img{
            width: 400px;
            display: block;
            margin: 0 auto;
        }
        .login h2{
            color: #123;
            margin-bottom: 0px;
            text-transform: uppercase;
        }
        .login p{
            color: #456;
            margin-bottom: 6px;
        }
        .login input{
            width: 60%;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            background-color: rgb(204, 220, 220);
            box-shadow: 2px 2px 5px #000000;
        }
        .login button{
            width: 60%;
            padding: 15px;
            border-radius: 20px;
            border: none;
            background-color: #123;
            color: #fff;
            cursor: pointer;
        }
        .login a{
            display: block;
            margin-top: 10px;
            color: #555;
            text-decoration: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class= "login">
            <img src="https://cdn.freebiesupply.com/logos/large/2x/nassau-1-logo-png-transparent.png" alt="logo do site">
            <h2>Acessar Conta</h2>
            <p>informe seu email e senha para continuar.</p>
            <form method= "post">
                <input type="email" name="email" placeholder="Seu email" required>
                <input type="password" name="senha" placeholder="Sua Senha" required>
                <button>Entrar</button>
            </form>
            <a href="teste.html">Esqueceu sua senha?</a>
            <a href="registrar.html">Não tem uma conta? Cadastre-se agora!</a>
        </div>
    </div>
        
</body>
</html>
