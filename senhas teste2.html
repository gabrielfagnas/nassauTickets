<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Controle de Atendimento</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef1f5;
      }

      /* CABEÇALHO */

      header {
        background: #1c0370;
        color: white;
        padding: 20px 30px;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        margin: 0;
      }

      .logout {
        background: #d9534f;
        border: none;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }

      .logout:hover {
        background: #b52b27;
      }

      /* CONTEÚDO */

      .container {
        width: 90%;
        max-width: 1100px;
        margin: 30px auto;
      }

      /* SENHA ATUAL */

      .senha-atual {
        background: white;
        padding: 30px;
        border-radius: 15px;
        text-align: center;

        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      .senha-atual h2 {
        margin-top: 0;
      }

      #senhaAtual {
        font-size: 60px;
        font-weight: bold;
        color: #1c0370;
        margin: 20px;
      }

      /* BOTÕES */

      .botoes {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      button {
        border: none;
        padding: 15px 25px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
      }

      .chamar {
        background: #1c0370;
        color: white;
      }

      .chamar:hover {
        background: #2905a0;
      }

      .descartar {
        background: #f0ad4e;
        color: white;
      }

      .descartar:hover {
        background: #d88916;
      }

      .relatorio {
        background: #337ab7;
        color: white;
      }

      .relatorio:hover {
        background: #245b89;
      }

      .resetar {
        background: #d9534f;
        color: white;
      }

      .resetar:hover {
        background: #b52b27;
      }

      /* RELATÓRIO */

      .relatorios {
        display: none;
        margin-top: 30px;

        background: white;
        padding: 25px;

        border-radius: 15px;

        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      .relatorios h2 {
        margin-top: 0;
      }

      .dados {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

        gap: 15px;
      }

      .card {
        padding: 20px;

        background: #f5f5f5;

        border-radius: 10px;

        text-align: center;
      }

      .card h3 {
        margin: 0 0 10px;
      }

      .numero {
        font-size: 35px;
        font-weight: bold;
        color: #1c0370;
      }

      /* FILA */

      .fila {
        margin-top: 30px;

        background: white;

        padding: 25px;

        border-radius: 15px;

        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      .fila ul {
        list-style: none;
        padding: 0;
      }

      .fila li {
        padding: 12px;

        border-bottom: 1px solid #ddd;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Controle de Atendimento</h1>

      <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="container">
      <!-- SENHA ATUAL -->

      <div class="senha-atual">
        <h2>Senha atual</h2>

        <div id="senhaAtual">---</div>

        <div class="botoes">
          <button class="chamar" onclick="chamarSenha()">Chamar Próxima</button>

          <button class="descartar" onclick="descartarSenha()">
            Descartar Senha
          </button>

          <button class="relatorio" onclick="mostrarRelatorio()">
            Relatórios
          </button>

          <button class="resetar" onclick="resetarSenhas()">
            Resetar Senhas
          </button>
        </div>
      </div>

      <!-- FILA -->

      <div class="fila">
        <h2>Fila de atendimento</h2>

        <ul id="fila">
          <li>SP001</li>
          <li>SE001</li>
          <li>SG001</li>
          <li>SP002</li>
          <li>SG002</li>
        </ul>
      </div>

      <!-- RELATÓRIOS -->

      <div class="relatorios" id="relatorios">
        <h2>Relatório de Atendimento</h2>

        <div class="dados">
          <div class="card">
            <h3>Senhas Emitidas</h3>

            <div class="numero" id="emitidas">5</div>
          </div>

          <div class="card">
            <h3>Senhas Chamadas</h3>

            <div class="numero" id="chamadas">0</div>
          </div>

          <div class="card">
            <h3>Senhas Atendidas</h3>

            <div class="numero" id="atendidas">0</div>
          </div>

          <div class="card">
            <h3>Senhas Descartadas</h3>

            <div class="numero" id="descartadas">0</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* CONTADORES */

      let chamadas = 0;

      let atendidas = 0;

      let descartadas = 0;

      /* CHAMAR SENHA */

      function chamarSenha() {
        const fila = document.getElementById("fila");

        const primeiraSenha = fila.querySelector("li");

        if (!primeiraSenha) {
          alert("Não existem senhas na fila.");

          return;
        }

        const senha = primeiraSenha.textContent;

        document.getElementById("senhaAtual").textContent = senha;

        /* Remove da fila */

        primeiraSenha.remove();

        /* Incrementa contador */

        chamadas++;

        document.getElementById("chamadas").textContent = chamadas;
      }

      /* DESCARTAR SENHA */

      function descartarSenha() {
        const senhaAtual = document.getElementById("senhaAtual");

        if (senhaAtual.textContent === "---") {
          alert("Nenhuma senha selecionada.");

          return;
        }

        if (
          confirm(
            "Deseja realmente descartar a senha " +
              senhaAtual.textContent +
              "?",
          )
        ) {
          descartadas++;

          document.getElementById("descartadas").textContent = descartadas;

          senhaAtual.textContent = "---";
        }
      }

      /* MOSTRAR RELATÓRIO */

      function mostrarRelatorio() {
        const relatorio = document.getElementById("relatorios");

        if (relatorio.style.display === "block") {
          relatorio.style.display = "none";
        } else {
          relatorio.style.display = "block";
        }
      }

      /* RESETAR */

      function resetarSenhas() {
        if (!confirm("Tem certeza que deseja resetar todas as senhas?")) {
          return;
        }

        /* Limpa fila */

        document.getElementById("fila").innerHTML = "";

        /* Reseta senha atual */

        document.getElementById("senhaAtual").textContent = "---";

        /* Reseta contadores */

        chamadas = 0;

        atendidas = 0;

        descartadas = 0;

        document.getElementById("chamadas").textContent = 0;

        document.getElementById("atendidas").textContent = 0;

        document.getElementById("descartadas").textContent = 0;

        alert("Sistema de senhas resetado.");
      }

      /* LOGOUT */

      function logout() {
        if (confirm("Deseja realmente sair?")) {
          window.location.href = "login.html";
        }
      }
    </script>
  </body>
</html>
