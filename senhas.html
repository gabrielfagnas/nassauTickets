<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem - Emissão de Senha</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .totem {
            background-color: white;
            width: 500px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .subtitulo {
            margin-bottom: 30px;
            color: #666;
        }

        .senha-btn {
            width: 100%;
            padding: 25px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        .prioritaria {
            background-color: #e74c3c;
            color: white;
        }

        .geral {
            background-color: #3498db;
            color: white;
        }

        .exames {
            background-color: #27ae60;
            color: white;
        }

        .senha-btn:hover {
            opacity: 0.85;
        }

        #resultado {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            background-color: #f1f1f1;
        }

        #numeroSenha {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
            color: #222;
        }

        .nova-senha {
            background-color: #555;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="totem">

        <h1>Laboratório de Análises Clínicas</h1>

        <p class="subtitulo">
            Selecione o tipo de atendimento
        </p>

        <button class="senha-btn prioritaria" onclick="emitirSenha('SP')">
            Senha Prioritária
        </button>

        <button class="senha-btn geral" onclick="emitirSenha('SG')">
            Senha Geral
        </button>

        <button class="senha-btn exames" onclick="emitirSenha('SE')">
            Retirada de Exames
        </button>

        <div id="resultado">

            <p>Sua senha é:</p>

            <div id="numeroSenha"></div>

            <p>
                Aguarde a chamada no painel.
            </p>

            <br>

            <button class="nova-senha" onclick="voltar()">
                Emitir outra senha
            </button>

        </div>

    </div>

    <script>

        // Contadores das senhas
        let sequencias = {
            SP: 0,
            SG: 0,
            SE: 0
        };

        function emitirSenha(tipo) {

            // Incrementa a sequência do tipo escolhido
            sequencias[tipo]++;

            // Obtém a data atual
            const agora = new Date();

            const ano = String(agora.getFullYear()).slice(-2);
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const dia = String(agora.getDate()).padStart(2, '0');

            // Sequência com 3 dígitos
            const sequencia = String(sequencias[tipo]).padStart(3, '0');

            // Monta a senha:
            // YYMMDD-PPSQ
            const senha = `${ano}${mes}${dia}-${tipo}${sequencia}`;

            // Mostra a senha
            document.getElementById("numeroSenha").textContent = senha;

            document.getElementById("resultado").style.display = "block";

            // Esconde os botões de emissão
            document.querySelectorAll(".senha-btn").forEach(function(botao) {
                botao.style.display = "none";
            });
        }

        function voltar() {

            // Esconde o resultado
            document.getElementById("resultado").style.display = "none";

            // Mostra novamente os botões
            document.querySelectorAll(".senha-btn").forEach(function(botao) {
                botao.style.display = "block";
            });
        }

    </script>

</body>
</html>
